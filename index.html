<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7900" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lowwin Diaspora" />
    <title>Lowwin Diaspora — Residential Property Competitions</title>
    <meta name="description" content="Mobile-first platform for the Ethiopian diaspora to enter transparent lowest-unique-bid competitions for verified residential properties in Ethiopia." />
    <meta property="og:title" content="Lowwin Diaspora — Residential Property Competitions" />
    <meta property="og:description" content="Mobile-first platform for the Ethiopian diaspora to enter transparent lowest-unique-bid competitions for verified residential properties in Ethiopia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var store = localStorage.getItem('lowwin_persistence_store');
          var parsed = store ? JSON.parse(store) : null;
          // Always open in light mode by default when users enter
          var dark = parsed && parsed['dark_mode'] === true ? true : false;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B0F19] text-[#0F172A] dark:text-[#F1F5F9] antialiased selection:bg-[#B45309] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
